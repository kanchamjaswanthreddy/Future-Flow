<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0B0B14" />

    <!-- Author & app identity -->
    <meta name="author" content="FutureFlow" />
    <meta name="application-name" content="FutureFlow" />
    <meta name="apple-mobile-web-app-title" content="FutureFlow" />
    <meta name="keywords" content="personal finance app, AI budgeting, subscription manager, cash flow forecasting, tax filing automation, debt payoff planner, net worth tracker, FutureFlow" />

    <!--seo-start-->
    <!-- Default SEO (replaced per-page during pre-render; overridden by react-helmet-async in browser) -->
    <title>FutureFlow — Moving Money, Building Futures</title>
    <meta name="description" content="FutureFlow unifies your banks, predicts cash flow, cancels subscriptions, and files your taxes — all automated. The one finance app that actually does everything." />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="FutureFlow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FutureFlow — Moving Money, Building Futures" />
    <meta property="og:description" content="FutureFlow unifies your banks, predicts cash flow, cancels subscriptions, and files your taxes — all automated." />
    <meta property="og:image" content="https://futureflow.app/logo.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://futureflow.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@futureflowapp" />
    <meta name="twitter:title" content="FutureFlow — Moving Money, Building Futures" />
    <meta name="twitter:description" content="FutureFlow unifies your banks, predicts cash flow, cancels subscriptions, and files your taxes — all automated." />
    <meta name="twitter:image" content="https://futureflow.app/logo.jpeg" />
    <!--seo-end-->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://futureflow.app/#organization",
          "name": "FutureFlow",
          "url": "https://futureflow.app",
          "logo": {
            "@type": "ImageObject",
            "url": "https://futureflow.app/logo.jpeg"
          },
          "sameAs": [],
          "description": "FutureFlow is an AI-powered personal finance platform that unifies bank accounts, predicts cash flow, automates subscription management, and files taxes — all in one app."
        },
        {
          "@type": "WebSite",
          "@id": "https://futureflow.app/#website",
          "url": "https://futureflow.app",
          "name": "FutureFlow",
          "publisher": { "@id": "https://futureflow.app/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://futureflow.app/blog?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
